# Minimal App Hosting config
# Docs: https://firebase.google.com/docs/app-hosting/configure
runConfig:
  minInstances: 0

env:
  - variable: NEXT_PUBLIC_SITE_NAME
    value: "App Hosting smoke"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "REPLACE_ME"
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "REPLACE_ME"   # e.g. myapp.firebaseapp.com
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "REPLACE_ME"
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "REPLACE_ME"
    availability:
      - BUILD
